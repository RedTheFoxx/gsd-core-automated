# Paths are relative to this configuration file.
workspace = "../../tmp/gsd-demo"
gsd_root = "../.."
rules_file = "rules.toml"
prompt = "Construire une CLI Python de liste de tâches avec ajout, liste et suppression, stockage JSON local et tests automatisés."

[llm]
base_url = "http://localhost:8000/v1"
model = "your-tool-capable-model"
api_key_env = "OPENAI_API_KEY"
# OpenRouter endpoint (key read from OPENROUTER_API_KEY by default on this host):
# base_url = "https://openrouter.ai/api/v1"
# model = "anthropic/claude-sonnet-4"   # provider/model id, or "openrouter/auto"; must support tools
# api_key_env = "OPENROUTER_API_KEY"
# decision_model = "another-model"  # Same endpoint; defaults to model.
# [llm.agent_models]
# gsd-executor = "coding-model"
# [llm.headers]                        # Extra request headers; overrides the default
# X-Title = "my-project"               # OpenRouter HTTP-Referer/X-Title attribution.
# [llm.request_options]                # OpenRouter fields such as provider/transforms/
# max_tokens = 8192                    # reasoning are accepted here too.

[runtime]
shell = "bash"
# Windows with Git for Windows:
# shell = "C:/Program Files/Git/bin/bash.exe"
node = "node"
allow_shell = true
max_calls = 300
max_steps = 100
max_depth = 3
max_context_chars = 300000
compact_trigger_ratio = 0.8
compact_target_ratio = 0.5
reconnect_attempts = 30
reconnect_timeout = 900
retry_initial_delay = 1
retry_max_delay = 30
timeout = 120
command_timeout = 120
# Use acceptance commands appropriate to YOUR project. Nonzero exit rejects completion.
verification_commands = ["python -m unittest discover -s tests -v"]
