[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsd-automated"
version = "0.1.0"
description = "Non-interactive Python host for GSD workflows and OpenAI-compatible models"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gsd-auto = "gsd_automated.cli:main"

[tool.setuptools.packages.find]
include = ["gsd_automated*"]
